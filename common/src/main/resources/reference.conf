# Defaults for every job. Override with environment variables (shown next to
# each setting) or with -Dconfig.file=/path/to/application.conf.
hvfhv {
  paths {
    # Root of the local/HDFS/object-store layout below.
    base = "data"
    base = ${?DATA_DIR}

    # Downloaded CSVs (scripts/download_sample.sh, scripts/get_zone_lookup.sh).
    raw-trips = ${hvfhv.paths.base}"/raw/trips"
    raw-zones = ${hvfhv.paths.base}"/raw/zones"

    # Where the speed layer archives every trip (exactly-once file sink). Each batch run
    # copies the committed files from here into the Hive table hive.database.trips_stream.
    landing-events = ${hvfhv.paths.base}"/landing/events"

    # Scratch space for the batch job's absorb step.
    staging = ${hvfhv.paths.base}"/staging"

    checkpoints = ${hvfhv.paths.base}"/checkpoints"
  }

  # Batch layer: the master dataset lives in Hive tables (see deploy/hive/master_tables.hql).
  hive {
    database = "hvfhv"
    database = ${?HIVE_DATABASE}
    metastore-uri = "thrift://localhost:9083"
    metastore-uri = ${?HIVE_METASTORE_URI}
  }

  # Serving layer.
  cassandra {
    host = "localhost"
    host = ${?CASSANDRA_HOST}
    port = 9042
    port = ${?CASSANDRA_PORT}
    keyspace = "hvfhv"
    keyspace = ${?CASSANDRA_KEYSPACE}
  }

  kafka {
    brokers = "localhost:9092"
    brokers = ${?KAFKA_BROKERS}
    topic = "hvfhv-trips"
    topic = ${?KAFKA_TOPIC}
  }

  speed {
    trigger-interval = 5 seconds
    trigger-interval = ${?SPEED_TRIGGER_INTERVAL}
    # Upper bound on Kafka messages per micro-batch, so a backlog can't produce one huge batch.
    max-offsets-per-trigger = 100000
    max-offsets-per-trigger = ${?SPEED_MAX_OFFSETS_PER_TRIGGER}
  }
}
